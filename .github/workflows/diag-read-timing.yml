name: DIAG read timing (temporary)

# TEMPORARY — branch fix/gate-green-r2 only, deleted before merge.
# Replays the oracle_read phases with a 60 s budget under strace (execve/connect) on the same
# runner class as the PR gate, so the log shows where the 5 s per-test budget is spent.
on:
  push:
    branches: [fix/gate-green-r2]
  workflow_dispatch:

jobs:
  diag:
    name: DIAG oracle_read phase timing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace >/dev/null
      - name: Phase timing (no strace)
        run: |
          set +e
          NODE_ENV=test bun test --isolate src/tools/__tests__/__diag-read-timing.test.ts 2>&1 | grep -E "DIAG|pass|fail|timed out"
          echo "exit=$?"
      - name: Phase timing under strace (execve/connect/openat gaps)
        run: |
          set +e
          NODE_ENV=test strace -f -tt -T -e trace=execve,connect,openat -o /tmp/strace.log bun test --isolate src/tools/__tests__/__diag-read-timing.test.ts 2>&1 | grep -E "DIAG|pass|fail|timed out"
          echo "--- execve/connect calls ---"
          grep -E "execve|connect\(" /tmp/strace.log | grep -v ENOENT | head -60
          echo "--- syscalls that took > 0.5 s (T column) ---"
          awk 'match($0, /<([0-9.]+)>$/, m) && m[1] > 0.5' /tmp/strace.log | head -40
      - name: The two real tests with a 60 s budget (durations printed)
        run: |
          set +e
          NODE_ENV=test bun test --isolate --timeout 60000 src/tools/__tests__/backend-tools-unit.test.ts src/tools/__tests__/access-logging.test.ts 2>&1 | grep -E "\((pass|fail)\)|pass$|fail$" | grep -E "handleRead resolves|document_access row|pass$|fail$"
          echo "exit=$?"
