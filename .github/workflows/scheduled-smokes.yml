name: Scheduled smokes

# Smokes that must NOT sit in the PR gate (audit 2026-09-05 P1-1 and the timing class): the README
# "Docker-first hero path" (builds the http-server image, runs the container) and the retro-index
# liveness/heap timing cases. Scheduled daily plus on demand; never a required branch-protection check.
on:
  schedule:
    - cron: '17 20 * * *'   # 03:17 ICT daily
  workflow_dispatch:

jobs:
  docker-hero:
    name: Docker hero path + timing smokes (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: README Docker hero path smoke
        run: bun test --isolate tests/integration/readme-docker-hero.test.ts

      - name: Retro-index liveness and heap timing
        run: bun test --isolate tests/integration/retro-index-liveness-timing.test.ts
